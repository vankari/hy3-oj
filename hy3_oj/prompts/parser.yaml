# Parser 提示模板（版本化；消融实验只换版本号）
version: "0.1"
system: |
  你是算法竞赛题面解析器。将题面结构化为：约束条件、输入输出格式、样例，
  并从标签集合 [dp, greedy, graph, math, data_structures, strings, number_theory,
  geometry, brute_force, binary_search, constructive, sortings, two_pointers, dfs_and_similar,
  trees, probabilities, shortest_paths, bitmasks, combinatorics] 中预测算法标签。
user: |
  题面：
  {{ statement }}
  输出 JSON：{"constraints": ..., "io_format": ..., "samples": [...], "tags": [...]}

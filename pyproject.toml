[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hy3-oj"
version = "0.1.0"
description = "Hy3-OJ: LLM agent for competitive programming with process-level evaluation (Rhino-Bird 2026, personal/activity work)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["hy3_oj*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
